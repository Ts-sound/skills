  </g>
  <g id="ep-agenda-list-slot" data-pptx-placeholder="body" data-pptx-bounds="80 220 1120 340">
    <text id="ep-agenda-list" data-pptx-carrier="true" x="80" y="256" fill="#657B83" font-size="20"><tspan x="80"><tspan fill="#CB4B16" font-weight="700">01</tspan>　开场判断：现在必须 All in AI</tspan><tspan x="80" dy="48"><tspan fill="#CB4B16" font-weight="700">02</tspan>　不是工具清单：先看结构</tspan><tspan x="80" dy="48"><tspan fill="#CB4B16" font-weight="700">03</tspan>　超级个体机制：缓存与可追踪</tspan><tspan x="80" dy="48"><tspan fill="#CB4B16" font-weight="700">04</tspan>　本期生产链路：31 轮 · 650+ 步</tspan><tspan x="80" dy="48"><tspan fill="#CB4B16" font-weight="700">05</tspan>　五层能力栈：从插件到工作台</tspan><tspan x="80" dy="48"><tspan fill="#CB4B16" font-weight="700">06</tspan>　老板与个体行动：三步落地</tspan><tspan x="80" dy="48"><tspan fill="#CB4B16" font-weight="700">07</tspan>　收束与评论：判断与下一步</tspan></text>
  </g>
  <g id="ep-slide-number-slot" data-pptx-placeholder="slide-number" data-pptx-bounds="1110 656 90 30">
