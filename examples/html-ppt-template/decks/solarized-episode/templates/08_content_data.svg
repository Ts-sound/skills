<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
  data-pptx-master="solarized_episode_master" data-pptx-master-name="Solarized Episode"
  data-pptx-layout="content-data" data-pptx-layout-name="Metric Strip"
  font-family="Noto Sans SC, Source Han Sans SC, Arial, sans-serif">
  <defs>
    <linearGradient id="ep-wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFCF3"/>
      <stop offset="1" stop-color="#FDF6E3"/>
    </linearGradient>
  </defs>
  <rect id="ep-master-bg" data-pptx-layer="master" x="0" y="0" width="1280" height="720" fill="#FDF6E3"/>
